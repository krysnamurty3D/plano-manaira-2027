<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plano Anual 2027 — Supermercado Manaíra</title>
<meta name="description" content="57 anos de tradição. Um novo ano de oportunidades para a sua marca no Supermercado Manaíra.">
<meta property="og:title" content="Plano Anual 2027 — Supermercado Manaíra">
<meta property="og:description" content="57 anos de tradição. Um novo ano de oportunidades.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://planoanualmanaira.k3d.app.br/">
<meta property="og:site_name" content="Supermercado Manaíra">
<meta property="og:locale" content="pt_BR">
<meta property="og:image" content="https://planoanualmanaira.k3d.app.br/assets/capa-share-2.jpg">
<meta property="og:image:secure_url" content="https://planoanualmanaira.k3d.app.br/assets/capa-share-2.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Capa do Plano Anual 2027 do Supermercado Manaíra">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://planoanualmanaira.k3d.app.br/">
<meta name="theme-color" content="#1E1A6B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css?v=7">
</head>
<body>
<header class="top">
  <span class="t"><b>Plano Anual</b> 2027</span>
  <button type="button" id="menuBtn" aria-expanded="false" aria-controls="menu">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Páginas
  </button>
</header>
<div class="progress" id="progress"></div>
<nav class="menu" id="menu" aria-label="Páginas do plano"></nav>
<main id="plan"><p class="loading">Carregando o plano…</p></main>
<script type="module">
import { DEFAULT_PLAN } from './data.js?v=2';
import { renderPlan, applyTheme, esc, waLink, WA_ICON } from './render.js?v=7';
import { firebaseConfig, PLAN_DOC, SDK } from './config.js?v=2';
{
  const root = document.getElementById('plan');
  const menu = document.getElementById('menu'), menuBtn = document.getElementById('menuBtn');
  async function load() {
    try {
      const { initializeApp } = await import(SDK + 'firebase-app.js');
      const { getFirestore, doc, getDoc } = await import(SDK + 'firebase-firestore-lite.js');
      const db = getFirestore(initializeApp(firebaseConfig));
      const snap = await Promise.race([getDoc(doc(db, ...PLAN_DOC)), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 8000))]);
      if (snap.exists() && Array.isArray(snap.data().pages)) return snap.data();
    } catch (e) { console.warn('Usando conteúdo padrão:', e && e.message); }
    return DEFAULT_PLAN;
  }
  const plan = await load();
  applyTheme(plan.theme);
  const pages = renderPlan(plan, root);
  const names = pages.map(p => p.kind === 'cover' ? 'Capa' : (p.kind === 'plan' ? 'Plano ' : '') + String(p.title || p.badge || '').replace(/\*/g, ''));
  menu.innerHTML = names.map((n, i) => '<a href="#p-' + i + '"><span>' + String(i + 1).padStart(2, '0') + '</span>' + esc(n) + '</a>').join('');
  menuBtn.addEventListener('click', () => { const o = menu.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', o); });
  menu.addEventListener('click', e => { if (e.target.closest('a')) { menu.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); } });
  document.addEventListener('click', e => { if (!e.target.closest('#menu,#menuBtn')) { menu.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); } });
  const bar = document.getElementById('progress');
  const onScroll = () => { const h = document.documentElement.scrollHeight - innerHeight; bar.style.width = (h > 0 ? scrollY / h * 100 : 0) + '%'; };
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
  // pausa vídeos que saem da tela
  const io = new IntersectionObserver(es => es.forEach(en => { if (!en.isIntersecting) en.target.pause(); }), { threshold: 0.1 });
  root.querySelectorAll('.media video').forEach(v => { io.observe(v); v.addEventListener('error', () => { const f = v.closest('.media'); if (f) f.innerHTML = '<p class="vid-err">Este vídeo não pôde ser reproduzido neste aparelho.</p>'; }); });
  // comparativo: tocar no nome do plano destaca a coluna
  root.addEventListener('click', e => {
    const b = e.target.closest('.cmp thead button'); if (!b) return;
    const t = b.closest('table'), on = t.dataset.hl === b.dataset.col;
    t.dataset.hl = on ? '' : b.dataset.col;
    t.querySelectorAll('thead button').forEach(x => x.setAttribute('aria-pressed', String(!on && x === b)));
  });
  // botão flutuante do WhatsApp (aparece depois da capa; some na página de contato)
  const wl = (plan.brand || {}).waFloat !== 'hide' && waLink('Olá! Vi o Plano Anual 2027 do Supermercado Manaíra e gostaria de mais informações.');
  if (wl) {
    const a = document.createElement('a');
    a.className = 'wa-float'; a.href = wl; a.target = '_blank'; a.rel = 'noopener';
    a.setAttribute('aria-label', 'Fale conosco no WhatsApp'); a.innerHTML = WA_ICON;
    document.body.appendChild(a);
    const inView = new Set();
    const upd = () => a.classList.toggle('show', scrollY > innerHeight * 0.6 && !inView.size);
    const io3 = new IntersectionObserver(es => { es.forEach(en => en.isIntersecting ? inView.add(en.target) : inView.delete(en.target)); upd(); }, { threshold: 0, rootMargin: '0px 0px -35% 0px' });
    root.querySelectorAll('.k-contact').forEach(s => io3.observe(s));
    addEventListener('scroll', upd, { passive: true }); upd();
  }
  // números contando de 0 até o valor quando aparecem na tela
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const fmt = (n, dec, grp) => { let [i, d] = n.toFixed(dec).split('.'); if (grp) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return d ? i + ',' + d : i; };
    const nums = [...root.querySelectorAll('.stat strong')].map(el => {
      const final = el.textContent, m = /^(\D*?)(\d{1,3}(?:\.\d{3})+|\d+)(?:,(\d+))?([\s\S]*)$/.exec(final.trim());
      if (!m) return null;
      const o = { el, final, pre: m[1], suf: m[4], grp: m[2].includes('.'), dec: m[3] ? m[3].length : 0, val: parseFloat(m[2].replace(/\./g, '') + (m[3] ? '.' + m[3] : '')) };
      el.setAttribute('aria-label', final); el.textContent = o.pre + fmt(0, o.dec, o.grp) + o.suf;
      return o;
    }).filter(Boolean);
    const io4 = new IntersectionObserver(es => es.forEach(en => {
      if (!en.isIntersecting) return; io4.unobserve(en.target);
      const o = nums.find(x => x.el === en.target), t0 = performance.now(), D = 1500;
      const step = t => { const k = Math.min(1, (t - t0) / D); o.el.textContent = k < 1 ? o.pre + fmt(o.val * (1 - Math.pow(1 - k, 3)), o.dec, o.grp) + o.suf : o.final; if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    }), { threshold: 0.4 });
    nums.forEach(o => io4.observe(o.el));
  }
  if (location.hash) document.querySelector(location.hash.replace(/[^#\w-]/g, ''))?.scrollIntoView();
}
</script>
</body>
</html>
